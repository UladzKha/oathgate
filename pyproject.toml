[project]
name = "oathgate"
version = "0.0.2"
description = "Freeze the eval scoring spec and your prediction before the run."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Uladzimir Khadakouski" }]
keywords = ["evaluation", "evals", "llm", "benchmark", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/UladzKha/oathgate"
Issues = "https://github.com/UladzKha/oathgate/issues"

[project.scripts]
oathgate = "oathgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oathgate"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
